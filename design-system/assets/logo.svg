<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" width="320" height="88" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Logotipo provisional de Oloroso Pit</title>
  <desc id="logoDesc">Marca provisional: monograma OP y la leyenda "marca provisional, placeholder". No es una identidad aprobada.</desc>

  <!-- Seal / monogram -->
  <rect x="4" y="14" width="60" height="60" rx="16" fill="#1E3B31"/>
  <rect x="11.5" y="21.5" width="45" height="45" rx="11" fill="none" stroke="#F6F5F0" stroke-opacity="0.28" stroke-width="1"/>
  <text x="34" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="1" fill="#F6F5F0">OP</text>
  <circle cx="58" cy="66" r="2.5" fill="#A05C3B"/>

  <!-- Wordmark -->
  <text x="78" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="2.2" fill="#1B211E">OLOROSO PIT</text>

  <!-- Provisional label: remove only after the owners approve a real logo -->
  <rect x="78" y="53" width="171" height="12" rx="6" fill="#F3E4DA"/>
  <text x="84" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.4" fill="#8A4A2C">MARCA PROVISIONAL · PLACEHOLDER</text>
  <line x1="78" y1="72" x2="249" y2="72" stroke="#A05C3B" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 4"/>
</svg>
